# Flexoki Dark — https://stephango.com/flexoki
# Matches tmux, yazi, ghostty and nvim themes in this dotfiles repo.

panel_bg = "#1C1B1A"        # base-950
bg_highlight = "#343331"    # base-850
fg_primary = "#B7B5AC"      # base-300
fg_secondary = "#878580"    # base-500
fg_dim = "#6F6E69"          # base-600

diff_add = "#879A39"        # green-400
diff_add_bg = "#252D09"     # green-900
diff_del = "#D14D41"        # red-400
